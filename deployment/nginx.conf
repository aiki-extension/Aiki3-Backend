# Reference copy of /etc/nginx/sites-available/aiki on the VPS.
# nginx runs natively on the host (not in Docker); this file is not
# deployed automatically and must be kept in sync manually.
server {
    listen 80;
    server_name aiki.zeeguu.dev www.aiki.zeeguu.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name aiki.zeeguu.dev www.aiki.zeeguu.dev;

    ssl_certificate /etc/letsencrypt/live/aiki.zeeguu.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiki.zeeguu.dev/privkey.pem;

    location = /ic-manager {
        return 301 /ic-manager/;
    }
    location /ic-manager/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}